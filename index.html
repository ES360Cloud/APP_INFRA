<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>eSoluciones 360 - Registro de Infraestructura</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Roboto:wght@400;500&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cyan: #00B4D8;
      --cyan-dark: #0096B4;
      --cyan-light: #E1F5FB;
      --green: #5CB85C;
      --black: #1a1a1a;
      --gray: #f5f5f5;
      --gray2: #e0e0e0;
      --text: #2d2d2d;
      --text2: #666;
      --white: #fff;
    }
    body { font-family: 'Roboto', sans-serif; color: var(--text); background: #f0f4f8; }
    .app { max-width: 700px; margin: 0 auto; background: var(--white); min-height: 100vh; position: relative; }
    .header { background: #111; padding: 14px 20px; display: flex; align-items: center; gap: 14px; }
    .logo-wrap { width: 52px; height: 52px; flex-shrink: 0; }
    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .header-text h1 { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; color: var(--cyan); letter-spacing: 0.5px; }
    .header-text p { font-size: 11px; color: #aaa; margin-top: 1px; }
    .progress-bar { height: 3px; background: var(--gray2); }
    .progress-fill { height: 100%; background: var(--cyan); transition: width 0.4s ease; }
    .screen { display: none; padding: 24px 20px; animation: fadeIn 0.25s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .screen-title { font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 800; color: var(--black); margin-bottom: 6px; }
    .screen-sub { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
    .infra-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .infra-card { border: 2px solid var(--gray2); border-radius: 12px; padding: 18px 12px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--white); }
    .infra-card.selected { border-color: var(--cyan); background: var(--cyan-light); }
    .infra-icon { font-size: 28px; display: block; margin-bottom: 8px; }
    .infra-label { font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: var(--text); }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 6px; display: block; }
    .form-input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--gray2); border-radius: 8px; font-size: 14px; font-family: 'Roboto', sans-serif; outline: none; }
    .form-input:focus { border-color: var(--cyan); }
    .btn { padding: 11px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; font-family: 'Nunito', sans-serif; cursor: pointer; border: none; transition: all 0.2s; text-align: center; }
    .btn-primary { background: var(--cyan); color: var(--white); }
    .btn-secondary { background: var(--gray); color: var(--text); border: 1.5px solid var(--gray2); }
    .btn-danger { background: #fee; color: #c00; border: 1.5px solid #fcc; font-size: 12px; padding: 6px 12px; }
    .btn-green { background: var(--green); color: var(--white); }
    .btn-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; min-width: 140px; }
    .photo-add-panel { border: 1.5px dashed var(--gray2); border-radius: 10px; padding: 16px; background: var(--gray); }
    .photos-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .photo-item { display: flex; align-items: center; gap: 10px; background: var(--cyan-light); border: 1px solid var(--cyan); border-radius: 8px; padding: 8px 12px; }
    .photo-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; }
    .photo-info { flex: 1; min-width: 0; }
    .photo-name { font-weight: 600; font-size: 13px; color: var(--cyan-dark); }
    .summary-section { border: 1px solid var(--gray2); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
    .summary-header { background: var(--cyan); color: var(--white); padding: 10px 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: center;}
    .summary-body { padding: 12px 14px; }
    .summary-photo-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--gray2); }
    .summary-thumb { width: 36px; height: 36px; object-fit: cover; border-radius: 4px; }
    .file-input-label { display: flex; justify-content: center; align-items: center; gap: 8px; border: 1.5px solid var(--gray2); border-radius: 8px; padding: 9px 14px; cursor: pointer; font-size: 13px; font-weight: 600; background: var(--white); flex: 1; }
    input[type=file] { display: none; }
    .notification { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 999; display: none; }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="logo-wrap">
      <img src="./esoluciones360.png" alt="Logo" id="logoImg" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';"/>
      <svg id="logoFallback" style="display:none;width:52px;height:52px;" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#00B4D8" opacity="0.2" stroke="#00B4D8" stroke-width="2"/><text x="50" y="56" text-anchor="middle" font-size="18" font-weight="bold" fill="#00B4D8" font-family="sans-serif">360</text></svg>
    </div>
    <div class="header-text">
      <h1>eSoluciones 360</h1>
      <p>Registro de Infraestructura de Red</p>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:33%"></div></div>

  <div class="screen active" id="screen1">
    <div class="screen-title">Tipo de infraestructura</div>
    <div class="infra-grid">
      <div class="infra-card" onclick="selectInfra('ARQUETA')" id="card_ARQUETA"><span class="infra-icon">🏗️</span><div class="infra-label">ARQUETA</div></div>
      <div class="infra-card" onclick="selectInfra('CR')" id="card_CR"><span class="infra-icon">📦</span><div class="infra-label">CR</div></div>
      <div class="infra-card" onclick="selectInfra('POSTES')" id="card_POSTES"><span class="infra-icon">🔌</span><div class="infra-label">POSTES</div></div>
      <div class="infra-card" onclick="selectInfra('SALIDAS LATERALES')" id="card_SALIDAS"><span class="infra-icon">↔️</span><div class="infra-label">SALIDAS</div></div>
      <div class="infra-card" onclick="selectInfra('PASOS AÉREOS')" id="card_PASOS" style="grid-column:1/-1;"><span class="infra-icon">🌉</span><div class="infra-label">PASOS AÉREOS</div></div>
    </div>
    <div class="btn-row"><button class="btn btn-primary" onclick="goStep2()" id="btnStep1" disabled>Continuar →</button></div>
  </div>

  <div class="screen" id="screen2">
    <div class="screen-title" id="screen2Title">Datos</div>
    <div class="form-group">
      <label class="form-label" id="nameLabel">Nombre del elemento</label>
      <input class="form-input" id="infraName" type="text" placeholder="Ej: P-01..." />
    </div>
    <div class="photos-list" id="photosList"></div>
    <div class="photo-add-panel">
      <div class="form-group">
        <label class="form-label">Nombre de la foto</label>
        <select class="form-input" id="photoNameSelect" onchange="handlePhotoNameChange()"></select>
      </div>
      <div class="form-group" id="otroGroup" style="display:none;">
        <input class="form-input" id="otroInput" type="text" placeholder="Nombre personalizado..."/>
      </div>
      <div style="display: flex; gap: 10px;">
        <label class="file-input-label" for="cam">📷 Cámara</label>
        <input type="file" id="cam" accept="image/*" capture="environment" onchange="addPhoto(this)"/>
        <label class="file-input-label" for="gal">🖼️ Galería</label>
        <input type="file" id="gal" accept="image/*" onchange="addPhoto(this)"/>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="goScreen(1)">← Cambiar Infra</button>
      <button class="btn btn-green" onclick="saveAndAddAnother()" style="flex: 2;">➕ Agregar otro elemento</button>
      <button class="btn btn-primary" onclick="saveAndGoSummary()">Ver resumen →</button>
    </div>
  </div>

  <div class="screen" id="screen3">
    <div class="screen-title">Resumen</div>
    <div id="summaryContainer"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="goBackToScreen2()">← Añadir más</button>
      <button class="btn btn-primary" onclick="generatePDF()">📄 PDF</button>
      <button class="btn btn-green" onclick="downloadPhotos()">⬇ ZIP Fotos</button>
      <button class="btn btn-danger" onclick="confirmReset()" style="width:100%; margin-top:10px;">🗑️ Borrar todo y empezar de nuevo</button>
    </div>
  </div>
</div>
<div class="notification" id="notification"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const PHOTO_OPTIONS = {
  'ARQUETA': ['RECORRIDO','PRISMA 1','PRISMA 2','ETIQUETA 1','ETIQUETA 2','PANORÁMICA','CROQUIS','OTRO'],
  'CR': ['TAPA CERRADA','CABLEADO','PRISMA 1','PRISMA 2','ETIQUETA','PANORÁMICA','OTRO'],
  'POSTES': ['PANORÁMICA','FERRETERÍA','CROQUIS','OTRO'],
  'SALIDAS LATERALES': ['PANORÁMICA','ETIQUETA','CROQUIS','OTRO'],
  'PASOS AÉREOS': ['PINZA 1','PINZA 2','PANORÁMICA','OTRO']
};

let selectedInfra = null;
let currentPhotos = [];
let allRecords = [];

function selectInfra(type) {
  selectedInfra = type;
  document.querySelectorAll('.infra-card').forEach(c => c.classList.remove('selected'));
  const el = document.getElementById('card_' + (type.includes('SALIDAS') ? 'SALIDAS' : type.includes('PASOS') ? 'PASOS' : type));
  if (el) el.classList.add('selected');
  document.getElementById('btnStep1').disabled = false;
}

function goStep2() {
  currentPhotos = [];
  document.getElementById('infraName').value = '';
  document.getElementById('screen2Title').textContent = 'Datos: ' + selectedInfra;
  populateOptions();
  renderPhotos();
  goScreen(2);
}

function goBackToScreen2() {
  currentPhotos = [];
  document.getElementById('infraName').value = '';
  renderPhotos();
  goScreen(2);
}

function populateOptions() {
  const sel = document.getElementById('photoNameSelect');
  sel.innerHTML = (PHOTO_OPTIONS[selectedInfra] || []).map(o => `<option value="${o}">${o}</option>`).join('');
  handlePhotoNameChange();
}

function handlePhotoNameChange() {
  document.getElementById('otroGroup').style.display = document.getElementById('photoNameSelect').value === 'OTRO' ? 'block' : 'none';
}

function addPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const name = document.getElementById('photoNameSelect').value === 'OTRO' ? document.getElementById('otroInput').value : document.getElementById('photoNameSelect').value;
  const reader = new FileReader();
  reader.onload = e => {
    currentPhotos.push({ name: name || 'Foto', dataUrl: e.target.result, fileName: file.name });
    renderPhotos();
    input.value = '';
  };
  reader.readAsDataURL(file);
}

function renderPhotos() {
  document.getElementById('photosList').innerHTML = currentPhotos.map((p, i) => `
    <div class="photo-item">
      <img class="photo-thumb" src="${p.dataUrl}">
      <div class="photo-info"><div class="photo-name">${p.name}</div></div>
      <button class="btn btn-danger" onclick="currentPhotos.splice(${i},1);renderPhotos()">✕</button>
    </div>`).join('');
}

function saveCurrentRecord() {
  const name = document.getElementById('infraName').value.trim();
  if (!name) {
    showNotification('⚠ Falta el nombre del elemento');
    return false;
  }
  if (currentPhotos.length === 0) {
    showNotification('⚠ Faltan fotos');
    return false;
  }
  allRecords.push({ type: selectedInfra, name, photos: [...currentPhotos] });
  return true;
}

function saveAndAddAnother() {
  if (saveCurrentRecord()) {
    currentPhotos = [];
    document.getElementById('infraName').value = '';
    renderPhotos();
    showNotification('✅ Guardado. Puede cargar el siguiente.');
    window.scrollTo(0, 0);
  }
}

function saveAndGoSummary() {
  const name = document.getElementById('infraName').value.trim();
  if (name || currentPhotos.length > 0) {
    if (!saveCurrentRecord()) return; 
  }
  renderSummary();
  goScreen(3);
}

function renderSummary() {
  const cont = document.getElementById('summaryContainer');
  cont.innerHTML = allRecords.map((r, i) => `
    <div class="summary-section">
      <div class="summary-header"><span>${r.type}: ${r.name}</span><button class="btn-danger" style="padding:2px 6px" onclick="allRecords.splice(${i},1);renderSummary()">✕</button></div>
      <div class="summary-body">${r.photos.map(p => `<div class="summary-photo-row"><img class="summary-thumb" src="${p.dataUrl}"><span>${p.name}</span></div>`).join('')}</div>
    </div>`).join('');
}

function goScreen(n) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen' + n).classList.add('active');
  document.getElementById('progressFill').style.width = (n * 33.3) + '%';
  window.scrollTo(0, 0);
}

function showNotification(m) {
  const n = document.getElementById('notification');
  n.textContent = m; n.style.display = 'block';
  setTimeout(() => n.style.display = 'none', 3000);
}

function confirmReset() {
  if(confirm("¿Seguro que quieres borrar todos los registros y fotos?")) {
    allRecords = [];
    goScreen(1);
    document.getElementById('btnStep1').disabled = true;
    document.querySelectorAll('.infra-card').forEach(c => c.classList.remove('selected'));
  }
}

async function generatePDF() {
  if (!allRecords.length) { showNotification('⚠ No hay registros'); return; }
  showNotification('⏳ Generando PDF...');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;

  allRecords.forEach(r => {
    doc.setFontSize(16); doc.text(`${r.type}: ${r.name}`, 15, y);
    y += 10;
    r.photos.forEach(p => {
      if (y > 250) { doc.addPage(); y = 20; }
      doc.addImage(p.dataUrl, 'JPEG', 15, y, 50, 40);
      doc.setFontSize(10); doc.text(p.name, 70, y + 20);
      y += 45;
    });
    y += 10;
  });
  doc.save('Registro_Infraestructura.pdf');
  showNotification('✅ PDF generado');
}

async function downloadPhotos() {
  if (!allRecords.length) { showNotification('⚠ No hay registros'); return; }
  showNotification('⏳ Preparando ZIP...');
  const zip = new JSZip();
  allRecords.forEach(r => {
    const folder = zip.folder(r.name);
    r.photos.forEach(p => folder.file(p.name + ".jpg", p.dataUrl.split(',')[1], {base64: true}));
  });
  const blob = await zip.generateAsync({type:"blob"});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "fotos_esoluciones.zip"; a.click();
  showNotification('✅ ZIP descargado');
}
</script>
</body>
</html>
